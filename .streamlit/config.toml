# 主题与 naver-price-tool 保持一致（薄荷绿 · 游戏像素风）
[theme]
primaryColor = "#2fbf7f"
# backgroundColor 用薄荷绿：让图表按浅色主题渲染（深色坐标轴文字）；
# 页面实际棋盘格底色由 app.py 的 CSS 控制（#9defc4）。
backgroundColor = "#9defc4"
secondaryBackgroundColor = "#d8fbe9"
textColor = "#1c1c1e"
font = "sans serif"
chartCategoricalColors = ["#2fbf7f", "#ffd93d", "#14724a", "#1c1c1e", "#7aa88f"]

[server]
# 行业表/生态表常内嵌比价截图，单文件可达 200MB+，放宽上传上限
maxUploadSize = 500
enableXsrfProtection = false

[browser]
gatherUsageStats = false
